description: This Dandiset contains processed, trial-aligned single-cell calcium activity
  recorded from mouse gustatory cortex during intraoral tastant delivery and optogenetic
  activation of locus coeruleus axons. It includes ChrimsonR and tdTomato control
  animals across phasic and tonic stimulation experiments using palatability, sucrose-NaCl
  mixture, and sucrose concentration stimulus sets. Neural activity consists of CNMFe-derived
  deltaF/noise traces.
